# Comprehensive Tag Relationship Mappings for AlbumExplore
# Developer-curated relationships to improve album similarity matching
# 
# Relationship Types:
#   - synonym: Tags that mean the same thing (weight 1.0)
#   - parent_child: Hierarchical relationship, child is subset of parent (weight 0.9)
#   - related: Related but distinct concepts (weight 0.75)
#   - close_related: Very closely related (weight 0.85)
#   - influence: Historical influence relationship (weight 0.65)
#   - exclude: Tags that are opposites/contradictory (weight -1.0)
#
# Format: tag_name: [list of relationships]

